name: PR Checks

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'data/**'
      - 'tests/**'
      - 'deployment/**'
      - 'pyproject.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'data/**'
      - 'tests/**'
      - 'deployment/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  # Fast, strictly offline gate: runs on every push and PR with zero API keys
  # or cloud credentials required.
  fast_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync

      - name: Run fast offline unit and eval contract tests
        env:
          TRACE_EXPORTER: 'none'
          ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: 'false'
        run: uv run pytest -m "not llm" -v

  # Live LLM evaluation suite: gated cleanly on GEMINI_API_KEY secret (or
  # triggered manually via workflow_dispatch) so PRs without credentials never fail.
  live_llm_evals:
    runs-on: ubuntu-latest
    needs: fast_tests
    permissions:
      contents: 'read'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync

      - name: Run live golden evaluation suite (when GEMINI_API_KEY is configured)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACE_EXPORTER: 'none'
          ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: 'false'
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not configured — skipping live LLM eval suite."
            exit 0
          fi
          uv run pytest -m llm tests/eval -v -s
